---
- name: Capture posted events from GitHub
  hosts: all
  sources:
    - name: Match events posted to port 5000
      ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000
        token: testTokenToAuthenticateWebhook
      filters:
        - ansible.eda.dashes_to_underscores:

  rules:
    # Capture push events
    - name: Get push event details
      condition: event.meta.headers.X_GitHub_Event == "push"
      action:
        post_event:
          event:
            type: "{{ event.meta.headers.X_GitHub_Event }}"
            gitref: "{{ event.payload.ref }}"
            repo_name: "{{ event.payload.repository.name }}"

    # Capture merge request creation events
    - name: Get merge request creation event details
      condition: >
        event.meta.headers.X_GitHub_Event == "pull_request"
        and event.payload.action == "opened"
      action:
        post_event:
          event:
            type: "{{ event.meta.headers.X_GitHub_Event }}"
            source_branch: "{{ event.payload.pull_request.head.ref }}"
            repo_name: "{{ event.payload.repository.name }}"
            merge_request_action: "{{ event.payload.action }}"

    # Run Deploy Prod job template when there is a push to the main branch
    - name: Respond to push events to the main branch
      condition: >
        event.repo_name == "ansible_demo"
        and event.type == "push"
        and event.gitref is search("main")
      action:
        run_job_template:
          name: Deploy Prod
          organization: Default

    # Run Deploy Dev job template when there is a push to the devel branch
    - name: Respond to push events to the devel branch
      condition: >
        event.repo_name == "ansible_demo"
        and event.type == "push"
        and event.gitref is search("devel")
      action:
        run_job_template:
          name: Deploy Dev
          organization: Default

    # Run Deploy Dev job template when a merge request is created
    # in the devel branch
    - name: Respond to merge request creation
      condition: >
        event.repo_name == "ansible_demo"
        and event.type == "pull_request"
        and event.merge_request_action == "opened"
        and event.source_branch == "devel"
      action:
        run_job_template:
          name: Deploy Dev
          organization: Default
