---
- name: Capture custom events
  hosts: all
  sources:
    - name: Inject custom events
      ansible.eda.generic:
        payload:
          - event_type: "login"
            user: "user1"
            status: "success"
          - event_type: "transaction"
            user: "user1"
            amount: 150.0
            status: "completed"
          - event_type: "logout"
            user: "user1"
            status: "success"
        final_payload:
          event_type: "shutdown"
          message: "All events processed"

  rules:
    # Capture login events
    - name: Capture login events
      condition: event.event_type == "login"
      action:
        post_event:
          event:
            type: "{{ event.event_type }}"
            user: "{{ event.user }}"
            status: "{{ event.status }}"

    # Capture transaction events
    - name: Capture transaction events
      condition: event.event_type == "transaction"
      action:
        post_event:
          event:
            type: "{{ event.event_type }}"
            user: "{{ event.user }}"
            amount: "{{ event.amount }}"
            status: "{{ event.status }}"

    # Capture logout events
    - name: Capture logout events
      condition: event.event_type == "logout"
      action:
        post_event:
          event:
            type: "{{ event.event_type }}"
            user: "{{ event.user }}"
            status: "{{ event.status }}"

    # # Respond to shutdown event
    # - name: Respond to shutdown event
    #   condition: event.event_type == "shutdown"
    #   action:
    #     debug:
    #       msg: "Shutting down after processing events. Message: {{ event.message }}"

    # Respond to all events
    - name: Respond to all events
      condition: event.event_type in ["login", "transaction", "logout"]
      action:
        debug:
          msg: "Processing event of type: {{ event.event_type }}"

    # Custom action on login event
    - name: Custom action on login
      condition: event.event_type == "login" and event.user == "user1"
      action:
        debug:
          msg: "User {{ event.user }} has logged in successfully."

    # Custom action on transaction event
    - name: Custom action on transaction
      condition: event.event_type == "transaction" and event.amount > 100
      action:
        debug:
          msg: "High-value transaction of {{ event.amount }} by user {{ event.user }}."
