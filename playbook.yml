- name: Nautobot Operations
  hosts: localhost
  vars_files:
    - vars/main.yml
  tasks:
    - name: Update Device Rack
      networktocode.nautobot.device:
          url: "{{ url }}"
          token: "{{ token }}"
          name: "{{ device }}"
          rack: "{{ rack }}"
          position: "{{ position }}"
          face: "{{ face }}"
          state: "{{ state }}"
