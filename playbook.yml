- name: Nautobot Operations
  hosts: localhost
  vars_files:
    - vars/main.yml
  tasks:
    - name: Update Device Rack
      networktocode.nautobot.device:
        url: "{{ url }}"
        token: "{{ token }}"
        name: ams01-edge-02
        rack: "{{ rack }}"
        position: "{{ position }}"
        face: "{{ face }}"
        state: "{{ state }}"
      register: results
    - debug:
        var: results
    - name: Set output data as fact
      set_stats:
        data:
          my_output: "{{ results }}"
